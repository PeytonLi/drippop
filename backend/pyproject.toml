[project]
name = "drippop-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "httpx==0.28.1",
    "pillow==12.3.0",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
    "pydantic==2.14.0",
    "pydantic-settings==2.15.0",
    "pyjwt[crypto]==2.15.1",
    "cryptography==50.0.2",
    "python-multipart==0.0.32",
    "jsonschema==4.26.0",
    "referencing==0.37.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.0",
    "mypy==2.4.0",
    "pyyaml==6.0.3",
    "types-pyyaml==6.0.12.20260906",
    "types-jsonschema==4.26.0.20261006",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
files = ["api", "core", "providers/base.py", "providers/fake.py", "worker.py", "tests"]
strict = true
check_untyped_defs = true
mypy_path = "."
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_any_generics = false
disallow_any_unimported = false
warn_return_any = false
check_untyped_defs = true
